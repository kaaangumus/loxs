name: Java Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Select JavaFX platform
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "JAVAFX_PLATFORM=win" >> "$GITHUB_ENV"
          else
            echo "JAVAFX_PLATFORM=linux" >> "$GITHUB_ENV"
          fi
      - name: Run tests
        shell: bash
        run: ./gradlew test -PjavafxPlatform=$JAVAFX_PLATFORM --console=plain
      - name: Build fat jar
        shell: bash
        run: ./gradlew fatJar -PjavafxPlatform=$JAVAFX_PLATFORM --console=plain
